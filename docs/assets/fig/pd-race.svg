<svg class='fig' viewBox='0 0 760 482' role='img' aria-label='The late RDMA write overwrites a reused page' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='race-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='race-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='race-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='race-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='race-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='race-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>The late write: a timeout is not proof that the remote write stopped</text><rect x='35.0' y='50' width='170' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='120' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Prefill + NIC</text><line x1='120' y1='84' x2='120' y2='470' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><rect x='345.0' y='50' width='150' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='420' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Decode</text><line x1='420' y1='84' x2='420' y2='470' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><rect x='585.0' y='50' width='150' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='660' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Request B</text><line x1='660' y1='84' x2='660' y2='470' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><path d='M420 112H124' fill='none' stroke='var(--accent2)' stroke-width='1.4' marker-end='url(#race-arr-accent2)'/><text x='270.0' y='104' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>write A&#x27;s KV into page P</text><path d='M120 140L416 382' fill='none' stroke='var(--accent)' stroke-width='3' stroke-dasharray='7 5' marker-end='url(#race-arr-accent)'/><text x='128' y='330' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--accent)'>RDMA WRITE queued on the NIC</text><text x='128' y='348' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)' font-style='italic'>(cannot be cancelled)</text><rect x='434' y='186' width='210' height='50' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.5'/><text x='539' y='206' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>local timeout fires</text><text x='539' y='225' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>abort A, free page P</text><path d='M660 270H424' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#race-arr-line)'/><text x='540.0' y='262' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>new request</text><text x='434' y='300' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>P is allocated to B</text><circle cx='420' cy='384' r='9' fill='var(--bad)'/><text x='438' y='380' font-size='13' text-anchor='start' font-weight='600' fill='var(--bad)'>A&#x27;s KV lands in page P</text><text x='438' y='398' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>and overwrites B&#x27;s KV</text><path d='M420 438H656' fill='none' stroke='var(--bad)' stroke-width='2' marker-end='url(#race-arr-bad)'/><text x='540.0' y='430' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--bad)'>HTTP 200, A&#x27;s context mixed in</text></svg>