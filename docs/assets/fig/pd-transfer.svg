<svg class='fig' viewBox='0 0 760 458' role='img' aria-label='One KV transfer in PD disaggregation' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='pdt-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='pdt-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='pdt-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='pdt-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='pdt-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='pdt-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>One KV transfer in PD disaggregation (SGLang + Mooncake, push style)</text><rect x='25.0' y='50' width='150' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='100' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Router</text><line x1='100' y1='84' x2='100' y2='446' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><rect x='305.0' y='50' width='150' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='380' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Prefill</text><line x1='380' y1='84' x2='380' y2='446' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><rect x='585.0' y='50' width='150' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='660' y='72' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Decode</text><line x1='660' y1='84' x2='660' y2='446' stroke='var(--line)' stroke-width='1' stroke-dasharray='3 4'/><path d='M100 118H376' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#pdt-arr-line)'/><path d='M100 140H656' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#pdt-arr-line)'/><text x='112' y='110' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>1  request + bootstrap room</text><rect x='590' y='170' width='140' height='34' rx='8' fill='var(--card)' stroke='var(--accent2)' stroke-width='1.5'/><text x='660' y='192' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>allocate pages</text><path d='M590 228H384' fill='none' stroke='var(--accent2)' stroke-width='1.4' marker-end='url(#pdt-arr-accent2)'/><text x='520.0' y='220' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>2  destination KV page indices</text><rect x='310' y='256' width='140' height='34' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.5'/><text x='380' y='278' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>compute KV</text><path d='M450 300H656' fill='none' stroke='var(--accent)' stroke-width='3' marker-end='url(#pdt-arr-accent)'/><text x='646' y='324' font-size='12.5' text-anchor='end' font-weight='600' fill='var(--accent)'>3  RDMA WRITE into Decode GPU memory</text><text x='646' y='342' font-size='12' text-anchor='end' font-weight='400' fill='var(--muted)' font-style='italic'>one-sided: Decode&#x27;s CPU never sees it</text><path d='M380 380H656' fill='none' stroke='var(--line)' stroke-width='1.4' stroke-dasharray='5 4' marker-end='url(#pdt-arr-line)'/><text x='520.0' y='372' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>4  done notice (after the write completes)</text><rect x='580' y='400' width='160' height='34' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='660' y='422' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>pages go to attention</text></svg>