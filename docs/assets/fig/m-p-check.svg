<svg class='fig' viewBox='0 0 760 240' role='img' aria-label='A checker takes a model and a property and returns either a proof or a counterexample' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='mp-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='mp-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='mp-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='mp-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='mp-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='mp-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>Formal verification checks a model against a property, for every behavior</text><rect x='24' y='56' width='210' height='72' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='129.0' y='80' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Model M</text><text x='129.0' y='100' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>the system as a state machine:</text><text x='129.0' y='118' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>states + actions</text><rect x='24' y='150' width='210' height='72' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='129.0' y='174' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Property P</text><text x='129.0' y='194' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>what must always (or</text><text x='129.0' y='212' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>eventually) be true</text><rect x='300' y='103' width='170' height='72' rx='8' fill='var(--card)' stroke='var(--accent2)' stroke-width='1.8'/><text x='385.0' y='127' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Checker</text><text x='385.0' y='147' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>TLC, Z3 or TLAPS</text><text x='385.0' y='165' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>tries every behavior</text><rect x='536' y='56' width='200' height='72' rx='8' fill='var(--card)' stroke='var(--good)' stroke-width='1.8'/><text x='636.0' y='80' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>P holds</text><text x='636.0' y='100' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>under the listed</text><text x='636.0' y='118' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>assumptions A</text><rect x='536' y='150' width='200' height='72' rx='8' fill='var(--card)' stroke='var(--bad)' stroke-width='1.8'/><text x='636.0' y='174' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>Counterexample</text><text x='636.0' y='194' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>an exact step-by-step</text><text x='636.0' y='212' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>trace that breaks P</text><path d='M234 92H262V130H296' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#mp-arr-line)'/><path d='M234 186H262V148H296' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#mp-arr-line)'/><path d='M470 130H500V92H532' fill='none' stroke='var(--good)' stroke-width='1.4' marker-end='url(#mp-arr-good)'/><path d='M470 148H500V186H532' fill='none' stroke='var(--bad)' stroke-width='1.4' marker-end='url(#mp-arr-bad)'/></svg>