<svg class='fig' viewBox='0 0 760 278' role='img' aria-label='PdLedger page states after a release or timeout' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='fix-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='fix-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='fix-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='fix-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='fix-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='fix-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>A page is reused only after proof that the write stopped</text><path d='M194 170H266' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#fix-arr-line)'/><path d='M440 162H480V110H532' fill='none' stroke='var(--good)' stroke-width='1.4' marker-end='url(#fix-arr-good)'/><path d='M440 178H480V230H532' fill='none' stroke='var(--bad)' stroke-width='1.4' marker-end='url(#fix-arr-bad)'/><rect x='24' y='142' width='170' height='56' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='109.0' y='166' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>PRIVATE</text><text x='109.0' y='186' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>in use by one request</text><rect x='270' y='142' width='170' height='56' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='355.0' y='166' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>DRAINING</text><text x='355.0' y='186' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>waits for stop evidence</text><text x='355' y='222' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)' font-style='italic'>its request has already failed</text><rect x='536' y='82' width='200' height='56' rx='8' fill='var(--card)' stroke='var(--good)' stroke-width='1.8'/><text x='636.0' y='106' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>FREE</text><text x='636.0' y='126' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>ACK: the write has stopped</text><rect x='536' y='202' width='200' height='56' rx='8' fill='var(--card)' stroke='var(--bad)' stroke-width='1.8'/><text x='636.0' y='226' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>QUARANTINED</text><text x='636.0' y='246' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>no proof: never reused</text><text x='230' y='152' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>release or</text><text x='230' y='164' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>timeout</text><text x='506' y='102' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>ACK</text><text x='506' y='248' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>no ACK</text></svg>