e-width='1.25'/><text x='380.0' y='76' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>S1  select</text><text x='380.0' y='96' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>tool and assurance</text><text x='380.0' y='114' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>tier per property</text><rect x='520' y='52' width='216' height='80' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.8'/><text x='628.0' y='76' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>S2  spec</text><text x='628.0' y='96' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>owner approves;</text><text x='628.0' y='114' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>hash-pinned</text><rect x='520' y='168' width='216' height='80' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.8'/><text x='628.0' y='192' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>S3  model</text><text x='628.0' y='212' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>from pinned code,</text><text x='628.0' y='230' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>file:line@commit</text><rect x='272' y='168' width='216' height='80' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.8'/><text x='380.0' y='192' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>S4  calibrate + traces</text><text x='380.0' y='212' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>bug fails, fix passes,</text><text x='380.0' y='230' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>real traces replay</text><rect x='24' y='168' width='216' height='80' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='132.0' y='192' font-size='14' text-anchor='middle' font-weight='600' fill='