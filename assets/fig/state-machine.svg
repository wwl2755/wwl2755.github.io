' y='100' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--fg)'>page 1</text><text x='130.0' y='120' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>B</text><rect x='172' y='76' width='64' height='56' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='204.0' y='100' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--fg)'>page 2</text><text x='204.0' y='120' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>free</text><rect x='246' y='76' width='64' height='56' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='278.0' y='100' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--fg)'>page 3</text><text x='278.0' y='120' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>free</text><text x='24' y='160' font-size='13' text-anchor='start' font-weight='400' fill='var(--fg)'>free = {2, 3}</text><text x='24' y='180' font-size='13' text-anchor='start' font-weight='400' fill='var(--fg)'>owner = {0: A, 1: B}</text><path d='M330 104H418' fill='none' stroke='var(--accent)' stroke-width='2' marker-end='url(#sm-arr-accent)'/><text x='374' y='94' font-size='13' text-anchor='middle' font-weight='600' fill='var(--accent)'>Alloc(C, 2)</text><text x='374' y='128' font-size='11.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>needs 2 ∈ free</text><text x='430' y='66' font-size='13' text-anchor='start' font-weight='600' fill='var(--muted)'>state s1</text><rect x='430' y='76' width='64' height='56' rx='8' fill='var(--card)' stroke='var(--accent2)' stroke-width='1.25'/><text x='462.0' y='100' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--fg)'>page 0</text><text x='462.0' y='120' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>A</text><rect x='504' y='76' width='64' height='56' rx='8' fill='var(--card)' stroke='var(--accent2)' stroke-width='1.25'/><t