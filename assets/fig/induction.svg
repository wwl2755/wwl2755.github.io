<svg class='fig' viewBox='0 0 760 316' role='img' aria-label='A non-inductive property versus a strengthened inductive invariant' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='ind-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='ind-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='ind-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='ind-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='ind-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='ind-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>Why a property must be strengthened before it can be proved by induction</text><ellipse cx='260' cy='185' rx='232' ry='118' fill='none' stroke='var(--line)' stroke-width='1.5'/><text x='40' y='58' font-size='13' text-anchor='start' font-weight='600' fill='var(--fg)'>P: nodes with lock_ref &gt; 0 are never evicted</text><ellipse cx='220' cy='190' rx='150' ry='72' fill='var(--accent2)' fill-opacity='0.08' stroke='var(--accent2)' stroke-width='2'/><text x='220' y='146' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--accent2)'>Inv = P + accurate lock_ref</text><circle cx='110' cy='195' r='7' fill='var(--accent2)'/><text x='110' y='219' font-size='12' text-anchor='middle' font-weight='600' fill='var(--fg)'>Init</text><circle cx='170' cy='172' r='5' fill='var(--fg)'/><path d='M117 195L162 172' fill='none' stroke='var(--accent2)' stroke-width='1.4' marker-end='url(#ind-arr-accent2)'/><circle cx='240' cy='208' r='5' fill='var(--fg)'/><path d='M177 172L232 208' fill='none' stroke='var(--accent2)' stroke-width='1.4' marker-end='url(#ind-arr-accent2)'/><circle cx='300' cy='182' r='5' fill='var(--fg)'/><path d='M247 208L292 182' fill='none' stroke='var(--accent2)' stroke-width='1.4' marker-end='url(#ind-arr-accent2)'/><text x='220' y='244' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)' font-style='italic'>every step from Inv stays in Inv</text><circle cx='420' cy='200' r='6' fill='var(--bad)'/><text x='420' y='186' font-size='13' text-anchor='middle' font-weight='600' fill='var(--bad)'>u</text><path d='M426 206L520 280' fill='none' stroke='var(--bad)' stroke-width='1.8' marker-end='url(#ind-arr-bad)'/><circle cx='524' cy='283' r='6' fill='none' stroke='var(--bad)' stroke-width='1.6'/><text x='520' y='96' font-size='12.5' text-anchor='start' font-weight='600' fill='var(--bad)'>u: unreachable, but inside P:</text><text x='520' y='114' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>lock_ref = 1, two requests</text><text x='520' y='132' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>use the node. One finishes,</text><text x='520' y='150' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>lock_ref drops to 0, and the</text><text x='520' y='168' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>node is evicted while in use.</text></svg>