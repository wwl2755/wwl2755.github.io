<svg class='fig' viewBox='0 0 760 260' role='img' aria-label='Where bugs can still hide after a proof' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='vm-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='vm-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='vm-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='vm-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='vm-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='vm-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>&quot;Verified&quot; means: under assumptions A, model M satisfies property P</text><rect x='24' y='54' width='220' height='128' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.5'/><text x='44' y='92' font-size='30' text-anchor='start' font-weight='700' fill='var(--accent)'>A</text><text x='78' y='86' font-size='14' text-anchor='start' font-weight='600' fill='var(--fg)'>Assumptions</text><text x='78' y='104' font-size='11.5' text-anchor='start' font-weight='400' fill='var(--muted)' font-style='italic'>where a bug can still hide</text><text x='44' y='132' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>false assumption, e.g.</text><text x='44' y='149' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>&quot;RDMA completion notices</text><text x='44' y='166' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>always arrive&quot;</text><rect x='270' y='54' width='220' height='128' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.5'/><text x='290' y='92' font-size='30' text-anchor='start' font-weight='700' fill='var(--accent)'>M</text><text x='324' y='86' font-size='14' text-anchor='start' font-weight='600' fill='var(--fg)'>Model</text><text x='324' y='104' font-size='11.5' text-anchor='start' font-weight='400' fill='var(--muted)' font-style='italic'>where a bug can still hide</text><text x='290' y='132' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>model differs from the code:</text><text x='290' y='149' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>a path left out, or a</text><text x='290' y='166' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>non-atomic step made atomic</text><rect x='516' y='54' width='220' height='128' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.5'/><text x='536' y='92' font-size='30' text-anchor='start' font-weight='700' fill='var(--accent)'>P</text><text x='570' y='86' font-size='14' text-anchor='start' font-weight='600' fill='var(--fg)'>Property</text><text x='570' y='104' font-size='11.5' text-anchor='start' font-weight='400' fill='var(--muted)' font-style='italic'>where a bug can still hide</text><text x='536' y='132' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>wrong or partial spec:</text><text x='536' y='149' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>you proved something other</text><text x='536' y='166' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>than what you care about</text><rect x='24' y='200' width='712' height='44' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25' stroke-dasharray='5 4'/><text x='380' y='227' font-size='13' text-anchor='middle' font-weight='400' fill='var(--muted)'>Trusted base, assumed correct: the checker, the compiler, the hardware</text></svg>