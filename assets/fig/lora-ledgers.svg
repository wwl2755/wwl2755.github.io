<svg class='fig' viewBox='0 0 760 276' role='img' aria-label='vLLM keeps LoRA state in two ledgers' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='lora-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='lora-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='lora-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='lora-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='lora-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='lora-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>Two ledgers, plus a copy in every queued request</text><rect x='24' y='56' width='210' height='92' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='129.0' y='80' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>front-end ledger</text><text x='129.0' y='100' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>serving.py</text><text x='129.0' y='118' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>name → LoRARequest</text><text x='129.0' y='136' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>(id, path)</text><rect x='284' y='56' width='190' height='92' rx='8' fill='var(--card)' stroke='var(--accent)' stroke-width='1.8'/><text x='379.0' y='80' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>queued request r</text><text x='379.0' y='100' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>carries the LoRARequest</text><text x='379.0' y='118' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>current at admission</text><rect x='524' y='56' width='212' height='92' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25'/><text x='630.0' y='80' font-size='14' text-anchor='middle' font-weight='600' fill='var(--fg)'>worker ledger</text><text x='630.0' y='100' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>worker_manager.py</text><text x='630.0' y='118' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>CPU LRU cache: id → weights</text><text x='630.0' y='136' font-size='12.5' text-anchor='middle' font-weight='400' fill='var(--muted)'>capacity max_cpu_loras</text><path d='M234 102H280' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#lora-arr-line)'/><path d='M474 102H520' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#lora-arr-line)'/><text x='257' y='172' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>at admission</text><text x='497' y='172' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)'>add_adapter()</text><rect x='24' y='196' width='712' height='64' rx='8' fill='var(--card)' stroke='var(--line)' stroke-width='1.25' stroke-dasharray='5 4'/><text x='40' y='222' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--fg)'>hot reload (load_inplace=True): the worker reloads from the new path and the front end points at it,</text><text x='40' y='242' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>but requests already queued still carry the old path; a cache miss loads whatever path the request carries.</text></svg>