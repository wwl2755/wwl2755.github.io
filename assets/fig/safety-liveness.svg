<svg class='fig' viewBox='0 0 760 204' role='img' aria-label='A safety violation is a finite trace; a liveness violation is an infinite loop' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='sl-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='sl-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='sl-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='sl-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='sl-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='sl-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>What a violation looks like</text><text x='24' y='62' font-size='13.5' text-anchor='start' font-weight='600' fill='var(--accent)'>Safety: a finite trace reaches a bad state</text><circle cx='50' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='50' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s0</text><circle cx='130' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='130' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s1</text><path d='M70 110H106' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><circle cx='210' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='210' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s2</text><path d='M150 110H186' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><circle cx='290' cy='110' r='20' fill='var(--card)' stroke='var(--bad)' stroke-width='1.6'/><text x='290' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s3</text><path d='M230 110H266' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><text x='290' y='150' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--bad)'>bad state</text><text x='24' y='186' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>e.g. a page owned by two requests</text><text x='400' y='62' font-size='13.5' text-anchor='start' font-weight='600' fill='var(--accent2)'>Liveness: the run loops forever</text><circle cx='426' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='426' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s0</text><circle cx='506' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='506' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s1</text><circle cx='586' cy='110' r='20' fill='var(--card)' stroke='var(--line)' stroke-width='1.6'/><text x='586' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>s2</text><circle cx='696' cy='110' r='20' fill='var(--card)' stroke='var(--good)' stroke-width='1.6' stroke-dasharray='4 3'/><text x='696' y='115' font-size='13' text-anchor='middle' font-weight='600' fill='var(--fg)'>done</text><path d='M446 110H482' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><path d='M526 104H562' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><path d='M566 118H530' fill='none' stroke='var(--line)' stroke-width='1.4' marker-end='url(#sl-arr-line)'/><path d='M606 110H672' fill='none' stroke='var(--good)' stroke-width='1.4' stroke-dasharray='4 4' marker-end='url(#sl-arr-good)'/><text x='639' y='100' font-size='12' text-anchor='middle' font-weight='400' fill='var(--muted)' font-style='italic'>never taken</text><text x='546' y='150' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--accent2)'>s1 ↔ s2 forever</text><text x='400' y='186' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>e.g. a request that never finishes</text></svg>