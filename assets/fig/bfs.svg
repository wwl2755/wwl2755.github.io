<svg class='fig' viewBox='0 0 760 366' role='img' aria-label='Model checking explores states level by level' xmlns='http://www.w3.org/2000/svg' font-family='var(--sans)'><defs><marker id='bfs-arr-line' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--line)'/></marker><marker id='bfs-arr-accent' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent)'/></marker><marker id='bfs-arr-accent2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--accent2)'/></marker><marker id='bfs-arr-bad' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--bad)'/></marker><marker id='bfs-arr-good' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--good)'/></marker><marker id='bfs-arr-muted' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='var(--muted)'/></marker></defs><text x='24' y='30' font-size='15' text-anchor='start' font-weight='600' fill='var(--fg)'>Breadth-first search finds the shortest counterexample first</text><line x1='380' y1='82' x2='220' y2='128' stroke='var(--line)' stroke-width='1.2'/><line x1='380' y1='82' x2='380' y2='128' stroke='var(--line)' stroke-width='1.2'/><line x1='380' y1='82' x2='540' y2='128' stroke='var(--accent)' stroke-width='2.4'/><line x1='220' y1='152' x2='140' y2='198' stroke='var(--line)' stroke-width='1.2'/><line x1='220' y1='152' x2='270' y2='198' stroke='var(--line)' stroke-width='1.2'/><line x1='380' y1='152' x2='380' y2='198' stroke='var(--line)' stroke-width='1.2'/><line x1='540' y1='152' x2='490' y2='198' stroke='var(--accent)' stroke-width='2.4'/><line x1='540' y1='152' x2='620' y2='198' stroke='var(--line)' stroke-width='1.2'/><line x1='140' y1='222' x2='100' y2='268' stroke='var(--line)' stroke-width='1.2'/><line x1='270' y1='222' x2='200' y2='268' stroke='var(--line)' stroke-width='1.2'/><line x1='270' y1='222' x2='300' y2='268' stroke='var(--line)' stroke-width='1.2'/><line x1='490' y1='222' x2='420' y2='268' stroke='var(--accent)' stroke-width='2.4'/><line x1='490' y1='222' x2='520' y2='268' stroke='var(--line)' stroke-width='1.2'/><line x1='490' y1='222' x2='660' y2='268' stroke='var(--line)' stroke-width='1.2'/><text x='24' y='75' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)'>depth 0</text><circle cx='380' cy='70' r='12' fill='var(--accent)' stroke='var(--line)' stroke-width='1.4'/><text x='24' y='145' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)'>depth 1</text><circle cx='220' cy='140' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='380' cy='140' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='540' cy='140' r='12' fill='var(--accent)' stroke='var(--line)' stroke-width='1.4'/><text x='24' y='215' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)'>depth 2</text><circle cx='140' cy='210' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='270' cy='210' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='380' cy='210' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='490' cy='210' r='12' fill='var(--accent)' stroke='var(--line)' stroke-width='1.4'/><circle cx='620' cy='210' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4' stroke-dasharray='3 3'/><text x='24' y='285' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)'>depth 3</text><circle cx='100' cy='280' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='200' cy='280' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='300' cy='280' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='420' cy='280' r='12' fill='var(--bad)' stroke='var(--bad)' stroke-width='1.4'/><circle cx='520' cy='280' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><circle cx='660' cy='280' r='12' fill='var(--card)' stroke='var(--line)' stroke-width='1.4'/><text x='420' y='314' font-size='12.5' text-anchor='middle' font-weight='600' fill='var(--bad)'>first violation found: a 3-step trace</text><text x='642' y='214' font-size='12' text-anchor='start' font-weight='400' fill='var(--muted)' font-style='italic'>seen: skipped</text><text x='24' y='350' font-size='12.5' text-anchor='start' font-weight='400' fill='var(--muted)'>All states at depth k are checked before any at depth k + 1, so no shorter violating trace can exist.</text></svg>